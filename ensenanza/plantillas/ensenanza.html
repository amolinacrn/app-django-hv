{% extends "base-curr.html" %}

{% load static %}

{% load crispy_forms_tags %}


{% block content_derecho %}

<div id="contenidoDisciplinaUdenar" style="width: 100%;">

</div>
{{ datos_cursos_impartidos|json_script:"datos-de-cursos-impartidos" }}
<script>
    function renderizandoTexto(Container, identificador_tematica, competencias_disciplina, contando) {
        console.log(contando);
        let contenido_acordeon = `
        <table class="competencias-table-ensenanza">

            <thead>
                <tr>
                ${competencias_disciplina.unidades_curso !== "Bibliografía"
                ? `<th style="width:50%;">Contenido temática</th>
                    <th>Material de ayuda</th>`
                : `<th colspan="2" style="width:50%;">Referencias</th>`}
                </tr> 
            </thead>

            <tbody id="${identificador_tematica}">
                <tr>${competencias_disciplina.unidades_curso !== "Bibliografía"
                ? `
            
                <td style="padding:20px ;">                    
                ${competencias_disciplina.competencias_unidad}           
                </td>    

                ` : ``}

                    <td  ${competencias_disciplina.unidades_curso === "Bibliografía" ? 'colspan="2"' : ''} style="padding:20px ;">                    
                        ${Container.cita_bibliografica
                .flatMap(cont => (cont.cita_bib || "").split("|")
                    .map(item => ({
                        /*revisar aquí si quiero agregar más cosas*/
                        cita: item,
                        link: cont.link_ref,
                        tipo: cont.tipo_bib,
                        unid: cont.numero_unidd
                    }))
                )
                .filter(item => item !== "")
                .map(item => {
                    /*condicion para que muestre el tipo de refrencia*/
                    if (competencias_disciplina.unidades_curso === "Bibliografía") {

                        if (item.tipo === "Libro") {
                            return `<li style="list-style: none;">
                        <div class="link_ref">
                        <a href="${item.link}" target="_blank">
                       ✅ ${item.tipo} 👉 ${item.cita}
                        </a>
                        </div>
                        </li>`

                        }
                    } else if (competencias_disciplina.unidades_curso !== "Bibliografía") {

                        if (item.tipo !== "Libro" && competencias_disciplina.numero_unidad === item.unid) {
                            return `<li style="list-style: none;">
                        <div class="link_ref">
                        <a href="${item.link}" target="_blank">
                        ✅ ${item.tipo} 👉 ${item.cita}
                        </a>
                        </div>
                        </li>`

                        }
                    }
                })
                .join("")}   
                    </td>
                </tr>
            </tbody>
        </table>
      `;
        return contenido_acordeon;
    };

    // Crear tabla y cuerpo
    const container = document.createElement("div");
    container.style.width = "100%"
    container.classList.add("tablaJavascrpt");

    const tablaDeContenido = JSON.parse(
        document.getElementById("datos-de-cursos-impartidos").textContent
    );

    tablaDeContenido.forEach((id_Container, km) => {

        const row = document.createElement("div");
        row.classList.add("fila-contenido");

        const tematicasHTML = `
        <div class="accordion accordion-flush accordion-curso" id="${id_Container.idd}">
            ${id_Container.tematicas_curso.map((contando_tematica, contador) => {

            const collapseId = `flush-collapse${id_Container.idd}_${contador}`;
            const headingId = `flush-heading${id_Container.idd}_${contador}`;

            return `
                    <div class="accordion-item">

                        <h2 class="accordion-header" id="${headingId}">
                            <button class="accordion-button collapsed" type="button"
                                data-bs-toggle="collapse"
                                data-bs-target="#${collapseId}"
                                aria-expanded="false"
                                aria-controls="${collapseId}">

                                <div style="font-size:14px; color:#000000">
                                    <b>${contando_tematica.unidades_curso}</b>
                                    
                                 
                                </div>

                            </button>
                        </h2>

                        <div id="${collapseId}"
                            class="accordion-collapse collapse"
                            aria-labelledby="${headingId}"
                            data-bs-parent="#${id_Container.idd}">

                            <div class="accordion-body">
                                ${renderizandoTexto(id_Container, id_Container.idd, contando_tematica, contador)}  
                            </div>

                        </div>
                    </div>
                `;

        }).join("")}
     
        </div>
    `;
        row.innerHTML = `
        <div class="class_div-copia">
            <div class="encabezadado">
               ${id_Container.disciplina} 
            </div>
            ${tematicasHTML}
        </div>
    `;

        container.appendChild(row);
    });

    document.getElementById("contenidoDisciplinaUdenar").appendChild(container);

</script>

{% endblock %}
